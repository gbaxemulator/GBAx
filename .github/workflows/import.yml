name: Import prepared GBAx source

on:
  push:
    branches: [main]
    paths: ['.bootstrap/ready']

permissions:
  contents: write
  actions: write

jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify and import the prepared source archive
        run: |
          python3 - <<'PY'
          import hashlib,io,os,shutil,tempfile,zipfile
          from pathlib import Path,PurePosixPath
          chunks=sorted(Path('.bootstrap').glob('source.part*'))
          data=b''.join(p.read_bytes() for p in chunks)
          expected='a808f654b423b3ba7aa2045043836c3b9f3c033dfd4159ebcb9b39ec1a87ef04'
          if hashlib.sha256(data).hexdigest()!=expected:
              raise SystemExit('Source archive checksum mismatch')
          with tempfile.TemporaryDirectory(dir=os.environ['RUNNER_TEMP']) as temporary:
              with zipfile.ZipFile(io.BytesIO(data)) as archive:
                  for entry in archive.infolist():
                      path=PurePosixPath(entry.filename)
                      if path.is_absolute() or '..' in path.parts or path.parts[0]!='gbax':
                          raise SystemExit('Unexpected archive path')
                  archive.extractall(temporary)
                  for entry in archive.infolist():
                      if not entry.is_dir():
                          mode=(entry.external_attr>>16)&0o777
                          if mode: (Path(temporary)/entry.filename).chmod(mode)
              source=Path(temporary)/'gbax'
              # Workflows are installed through the connected account, before
              # this import. The job never modifies workflow files.
              workflow=Path('.github/workflows/release.yml')
              if workflow.read_bytes()!=(source/workflow).read_bytes():
                  raise SystemExit('Release workflow differs from the tested source')
              shutil.rmtree(source/'.github/workflows')
              shutil.copytree(source,Path('.'),dirs_exist_ok=True)
          shutil.rmtree('.bootstrap')
          PY
          git config user.name 'GBAx'
          git config user.email '262314566+gbaxemulator@users.noreply.github.com'
          git add --all --force
          git commit -m 'Import tested GBAx source and desktop packaging'
          git push origin HEAD:main
      - name: Start native desktop builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --ref main -f sign_macos=false -f create_draft_release=false
